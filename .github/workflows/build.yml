
name: Build ARIEL PLAYER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -o ARIEL_PLAYER_Projekt_Android_v1_2.zip -d source

      - name: Build APK
        run: |
          find source -name settings.gradle -o -name settings.gradle.kts
          cd source/ARIEL_PLAYER
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ARIEL-PLAYER-APK
          path: source/ARIEL_PLAYER/app/build/outputs/apk/debug/app-debug.apk
